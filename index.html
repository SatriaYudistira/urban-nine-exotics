<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Urban Nine Exotics</title>
  <meta name="description" content="Ball pythons bred in Jakarta. Available animals, breeder collection and how to buy.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,300..900;1,62..125,400&family=Permanent+Marker&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="theme-color" content="#0e0d0c">
  <meta property="og:title" content="Urban Nine Exotics">
  <meta property="og:description" content="Quality reptiles. Trusted care. Ball pythons bred in Jakarta.">
  <meta property="og:image" content="https://satriayudistira.github.io/urban-nine-exotics/assets/logo.jpg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip" href="#catalog" data-i18n="skip">Skip to animals</a>

  <header class="site-head">
    <div class="wrap head-row">
      <a class="wordmark" href="#/" aria-label="Urban Nine Exotics, home">
        <img class="wm-logo" src="assets/logo-160.jpg" width="42" height="42" alt="">
        <span class="wm-text"><span class="wm-line"><span class="wm-urban">Urban</span><span class="wm-nine">Nine</span></span><span class="wm-exotics">Exotics</span></span>
      </a>
      <nav class="main-nav" aria-label="Main">
        <a href="#/available" data-nav="available" data-i18n="nav.available">Available</a>
        <a href="#/collection" data-nav="collection" data-i18n="nav.collection">Collection</a>
        <a href="#projects" data-i18n="nav.projects">Projects</a>
        <a href="#/research" data-nav="research" data-i18n="nav.research">Research</a>
        <a href="#about" data-i18n="nav.about">About</a>
        <a href="#contact" data-i18n="nav.contact">Contact</a>
      </nav>
      <div class="lang-switch" role="group" aria-label="Language / Bahasa">
        <button type="button" data-lang="id" lang="id">ID</button><button type="button" data-lang="en" lang="en">EN</button>
      </div>
      <button class="icon-btn theme-btn" type="button" aria-label="Switch colour theme" data-i18n-attr="aria-label:theme" data-theme-toggle>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <main id="public">
    <section class="hero wrap" id="hero" aria-label="Featured animal" data-i18n-attr="aria-label:hero.aria"></section>

    <section class="storebar" aria-label="About the breeder" data-i18n-attr="aria-label:sb.aria">
      <div class="wrap storebar-row" id="storebar"></div>
    </section>

    <section class="catalog wrap" id="catalog" aria-label="Animals">
      <div class="tabs" role="tablist" aria-label="Animal lists" data-i18n-attr="aria-label:tabs">
        <button role="tab" data-tab="available"><span data-i18n="tab.available">Available</span> <span class="tab-n"></span></button>
        <button role="tab" data-tab="collection"><span data-i18n="tab.collection">Collection</span> <span class="tab-n"></span></button>
        <button role="tab" data-tab="sold"><span data-i18n="tab.sold">Sold</span> <span class="tab-n"></span></button>
      </div>

      <form class="filters" id="filters" role="search" onsubmit="return false">
        <label class="search">
          <span class="sr" data-i18n="search.label">Search by gene or ID</span>
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <input type="search" name="q" placeholder="Search genes, e.g. clown, het pied" data-i18n-attr="placeholder:search.ph" autocomplete="off">
        </label>
        <div class="seg" role="group" aria-label="Sex" data-i18n-attr="aria-label:sex">
          <button type="button" data-sex="all" aria-pressed="true" data-i18n="sex.all">All</button>
          <button type="button" data-sex="F" aria-pressed="false" data-i18n="sex.F">Female</button>
          <button type="button" data-sex="M" aria-pressed="false" data-i18n="sex.M">Male</button>
        </div>
        <label class="select"><span class="sr" data-i18n="year.label">Hatch year</span><select name="year"></select></label>
        <label class="select"><span class="sr" data-i18n="sort.label">Sort</span>
          <select name="sort">
            <option value="featured" data-i18n="sort.featured">Featured first</option>
            <option value="newest" data-i18n="sort.newest">Newest hatch</option>
            <option value="price-asc" data-i18n="sort.price-asc">Price, low to high</option>
            <option value="price-desc" data-i18n="sort.price-desc">Price, high to low</option>
          </select>
        </label>
      </form>

      <div class="facets" id="facets" role="group" aria-label="Filter by gene" data-i18n-attr="aria-label:facets"></div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
      <div class="grid" id="grid"></div>
    </section>

    <section class="projects" id="projects" aria-labelledby="projects-h" hidden>
      <div class="wrap">
        <div class="section-head">
          <h2 id="projects-h">Breeding season</h2>
          <p class="muted" data-i18n="proj.sub">What we're pairing this season. Ask to be told when a clutch hatches.</p>
        </div>
        <ul class="pairings" id="pairings"></ul>
      </div>
    </section>

    <section class="about" id="about" aria-labelledby="about-h">
      <div class="wrap about-grid">
        <div>
          <h2 id="about-h" data-i18n="about.h">About Urban Nine</h2>
          <div class="prose" id="about-text"></div>
          <div id="about-fig"></div>
        </div>
        <div>
          <h2 data-i18n="how.h">How to buy</h2>
          <ol class="steps" id="steps"></ol>
        </div>
      </div>
    </section>
  </main>
  <main id="research-root" hidden></main>
  <div id="admin-root" hidden></div>

  <footer class="site-foot" id="contact">
    <div class="wrap foot-grid">
      <div>
        <img class="foot-logo" src="assets/logo.jpg" width="148" height="148" alt="Urban Nine Exotics logo" loading="lazy">
        <p class="brand-tagline">Quality reptiles. Trusted care.</p>
        <p class="muted" id="foot-location"></p>
      </div>
      <ul class="contacts" id="contacts"></ul>
    </div>
    <div class="wrap foot-base muted">
      <span>© <span id="year"></span> Urban Nine Exotics</span>
    </div>
  </footer>

  <dialog class="detail" id="detail" aria-labelledby="detail-title"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/i18n.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/genes.js"></script>
  <script src="js/photos.js"></script>
  <script src="js/app.js"></script>
  <script src="js/research-id.js"></script>
  <script src="js/research.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
